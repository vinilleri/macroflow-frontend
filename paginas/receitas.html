<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receitas · MacroFlow</title>
    <link rel="stylesheet" href="../style/macroflow.css" />
    <link rel="icon" href="../img/icone.png" />
  </head>
  <body>
    <div class="mf-shell">
      <div class="mf-frame">
        <nav class="mf-topbar">
          <a class="mf-brand" href="home.html">
            <span class="mf-brand-mark">
              <img src="../img/icone.png" alt="MacroFlow" />
            </span>
          </a>

          <div class="mf-top-actions">
            <a href="perfil.html">Perfil</a><a href="home.html">Núcleo</a>
            <label class="mf-theme-switch" title="Alternar tema">
              <input
                type="checkbox"
                id="temaSwitch"
                onchange="mudarCorFundo()"
              />
              <span class="mf-theme-track">
                <svg class="icon-sun" viewBox="0 0 24 24">
                  <circle cx="12" cy="12" r="4" />
                  <path
                    d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                  />
                </svg>
                <svg class="icon-moon" viewBox="0 0 24 24">
                  <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
                </svg>
                <span class="mf-theme-thumb"></span>
              </span>
            </label>
          </div>
        </nav>
        <nav class="mf-bottom-nav">
          <a class="" href="home.html"
            ><svg viewBox="0 0 24 24">
              <path d="M20 4C12 4 5 8 5 15c0 2.8 2.2 5 5 5 7 0 10-7 10-16Z" />
              <path d="M5 19c2-4 5-7 10-9" /></svg
            ><span>Início</span></a
          ><a class="active" href="comidas.html"
            ><svg viewBox="0 0 24 24">
              <path d="M6 4v7a3 3 0 0 0 3 3V4" />
              <path d="M12 4v16" />
              <path d="M16 4v16" />
              <path d="M20 4v16" /></svg
            ><span>Alimentação</span></a
          ><a class="" href="meuCorpo.html"
            ><svg viewBox="0 0 24 24">
              <circle cx="12" cy="4.5" r="2.3" />
              <path d="M7.5 20c.6-5.2 1.4-8.9 4.5-8.9s3.9 3.7 4.5 8.9" />
              <path d="M9 8.5c.8 1.2 1.8 1.8 3 1.8s2.2-.6 3-1.8" /></svg
            ><span>Meu Corpo</span></a
          ><a class="" href="chatbot.html"
            ><svg viewBox="0 0 24 24">
              <path
                d="M8 17H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-4l-4 3v-3Z"
              />
              <path d="M8 10h.01M12 10h.01M16 10h.01" /></svg
            ><span>IA</span></a
          >
        </nav>
        <main>
          <header class="mf-page-head">
            <div>
              <div class="mf-kicker">ALIMENTAÇÃO</div>
              <h1 class="mf-title">Receitas</h1>
              <p class="mf-subtitle">
                Receitas são uma parte própria da alimentação: crie, ajuste
                itens e consuma quando quiser.
              </p>
            </div>
            <a class="mf-btn mf-btn-primary" href="cadastrarReceita.html"
              >Nova receita
              <svg viewBox="0 0 24 24">
                <path d="M5 12h14" />
                <path d="m13 6 6 6-6 6" /></svg
            ></a>
          </header>
          <div class="mf-area-nav">
            <a href="comidas.html">Alimentos</a
            ><a class="active" href="receitas.html">Receitas</a
            ><a href="consumoDia.html">Consumo de hoje</a>
          </div>
          <section class="mf-card mf-card-pad">
            <div class="mf-toolbar">
              <div>
                <div class="mf-card-title">Suas receitas</div>
                <p class="mf-note">
                  Cada receita pode ser editada, consumida ou excluída.
                </p>
              </div>
              <a class="mf-btn mf-btn-soft" href="cadastrarReceita.html"
                ><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" /></svg>
                Criar</a
              >
            </div>
            <div class="mf-divider"></div>
            <div class="mf-table-wrap"><table id="tableReceitas"></table></div>
          </section>
        </main>
      </div>
    </div>
    <script src="../script/api.js"></script>
    <script src="../script/consumo.js"></script>
    <script src="../script/receita.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", listarReceitas);
    </script>
  </body>
</html>
