<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Criar conta · MacroFlow</title>
    <link rel="stylesheet" href="../style/macroflow.css" />
    <link rel="icon" href="../img/icone.png" />
  </head>
  <body>
    <div class="mf-auth-shell">
      <section class="mf-auth">
        <aside class="mf-auth-aside">
          <div class="mf-kicker">Primeiro passo</div>
          <h1 class="mf-title" style="font-size: 46px">Comece pelo básico.</h1>
          <p class="mf-subtitle" style="color: rgba(49, 91, 65, 0.78)">
            O restante da experiência é organizado depois do acesso.
          </p>
        </aside>
        <section class="mf-auth-panel">
          <div style="height: 32px"></div>
          <div class="mf-kicker">Criar conta</div>
          <h2 class="mf-title" style="font-size: 36px">Vamos começar.</h2>
          <form
            class="mf-form"
            style="margin-top: 22px"
            onsubmit="salvarDados(event)"
          >
            <div class="mf-field">
              <label for="nome">Nome</label
              ><input type="text" id="nome" required />
            </div>
            <div class="mf-field">
              <label for="email">E-mail</label
              ><input type="email" id="email" required />
            </div>
            <div class="mf-field">
             <div class="mf-field">
  <label for="senha">Senha</label>

  <div class="mf-password-input">
    <input type="password" id="senha" required />

    <button type="button" id="toggleSenha" aria-label="Mostrar senha" onclick="mostrarSenha()">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle
          cx="12"
          cy="12"
          r="3"
          stroke="currentColor"
          stroke-width="2"
        />
      </svg>
    </button>
  </div>
</div>

<div class="mf-password-rules">
  <div id="senha-tamanho">❌ Pelo menos 8 caracteres</div>
  <div id="senha-maiuscula">❌ Uma letra maiúscula</div>
  <div id="senha-numero">❌ Um número</div>
  <div id="senha-especial">❌ Um caractere especial</div>
</div>

            <div class="mf-field">
              <label for="atividadeFisica">Atividade física</label
              ><select id="atividadeFisica"></select>
            </div>
            <button class="mf-btn mf-btn-primary" type="submit">
              Criar conta
            </button>
          </form>
          <p class="mf-note" style="margin-top: 18px">
            Já tem conta?
            <a
              style="color: var(--mf-forest); font-weight: 800"
              href="login.html"
              >Entrar</a
            >
          </p>
        </section>
      </section>
    </div>
    <script src="../script/api.js"></script>
    <script src="../script/usuario.js"></script>
  </body>
</html>
