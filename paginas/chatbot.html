<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Magali · MacroFlow</title>
    <link rel="stylesheet" href="../style/macroflow.css" />
    <link rel="icon" href="../img/icone.png" />
  </head>
  <body>
    <div class="mf-shell">
      <div class="mf-frame">
        <nav class="mf-topbar">
          <a class="mf-brand" href="home.html">
            <span class="mf-brand-mark">
              <img src="../img/icone.png" alt="MacroFlow" />
            </span>
          </a>

          <div class="mf-top-actions">
            <a href="perfil.html">Perfil</a><a href="home.html">Núcleo</a>
          </div>
        </nav>
        <nav class="mf-bottom-nav">
          <a class="" href="home.html"
            ><svg viewBox="0 0 24 24">
              <path d="M20 4C12 4 5 8 5 15c0 2.8 2.2 5 5 5 7 0 10-7 10-16Z" />
              <path d="M5 19c2-4 5-7 10-9" /></svg
            ><span>Início</span></a
          ><a class="" href="comidas.html"
            ><svg viewBox="0 0 24 24">
              <path d="M6 4v7a3 3 0 0 0 3 3V4" />
              <path d="M12 4v16" />
              <path d="M16 4v16" />
              <path d="M20 4v16" /></svg
            ><span>Alimentação</span></a
          ><a class="" href="meuCorpo.html"
            ><svg viewBox="0 0 24 24">
              <circle cx="12" cy="4.5" r="2.3" />
              <path d="M7.5 20c.6-5.2 1.4-8.9 4.5-8.9s3.9 3.7 4.5 8.9" />
              <path d="M9 8.5c.8 1.2 1.8 1.8 3 1.8s2.2-.6 3-1.8" /></svg
            ><span>Meu Corpo</span></a
          ><a class="active" href="chatbot.html"
            ><svg viewBox="0 0 24 24">
              <path
                d="M8 17H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-4l-4 3v-3Z"
              />
              <path d="M8 10h.01M12 10h.01M16 10h.01" /></svg
            ><span>IA</span></a
          >
        </nav>
        <main style="margin-top: 26px">
          <section class="mf-card mf-chat-shell">
            <header class="mf-chat-head">
              <div class="mf-magali-brand">
                <div class="mf-magali-avatar">
                  <svg viewBox="0 0 24 24">
                    <path
                      d="M8 17H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-4l-4 3v-3Z"
                    />
                    <path d="M8 10h.01M12 10h.01M16 10h.01" />
                  </svg>
                </div>
                <div class="mf-chat-copy">
                  <strong>Magali</strong
                  ><span>Sua conversa atual com o assistente</span>
                </div>
              </div>
              <button class="mf-btn mf-btn-danger" onclick="deletarChat()">
                Apagar conversa
              </button>
            </header>
            <div id="chat"></div>
            <div id="loading" style="display: none">
              Magali está preparando uma resposta…
            </div>
            <div class="mf-chat-composer">
              <input
                id="mensagem"
                placeholder="Escreva para a Magali"
                aria-label="Mensagem para Magali"
                onkeydown="if (event.key === 'Enter') enviar();"
              /><button
                class="send-button"
                aria-label="Enviar"
                onclick="enviar()"
              >
                <svg viewBox="0 0 24 24">
                  <path d="m4 4 16 8-16 8 3.5-8L4 4Z" />
                  <path d="M7.5 12H20" />
                </svg>
              </button>
            </div>
          </section>
        </main>
      </div>
    </div>
    <script src="../script/api.js"></script>
    <script src="../script/assistente.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", carregarChat);
    </script>
  </body>
</html>
