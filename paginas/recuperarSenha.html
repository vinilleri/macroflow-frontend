<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova senha · MacroFlow</title>
    <link rel="stylesheet" href="../style/macroflow.css" />
    <link rel="icon" href="../img/icone.png" />
  </head>

  <body>
    <div class="mf-auth-shell">
      <section class="mf-recovery-card">
        <div class="mf-recovery-brand">
          <a class="mf-brand" href="login.html">
            <span class="mf-brand-mark">
              <img src="../img/icone.png" alt="MacroFlow" />
            </span>
          </a>
        </div>

        <div class="mf-kicker">Nova senha</div>

        <h1 class="mf-title">Crie uma nova senha.</h1>

        <p class="mf-subtitle">
          Escolha uma nova senha para recuperar o acesso à sua conta MacroFlow.
        </p>

        <form
          class="mf-form mf-recovery-form"
          onsubmit="
            redefinirSenha();
            return false;
          "
        >
          <div class="mf-field">
            <label for="senha">Senha</label>

            <div class="mf-password-input">
              <input
                type="password"
                id="novaSenha"
                placeholder="Digite sua nova senha"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                id="toggleSenha"
                aria-label="Mostrar senha"
                onclick="mostrarSenha()"
              >
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M2 12C2 12 5.5 5 12 5C18.5 5 22 12 22 12C22 12 18.5 19 12 19C5.5 19 2 12 2 12Z"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle
                    cx="12"
                    cy="12"
                    r="3"
                    stroke="currentColor"
                    stroke-width="2"
                  />
                </svg>
              </button>
            </div>
          </div>
          <div class="mf-password-rules">
            <div id="senha-tamanho">❌ Pelo menos 8 caracteres</div>
            <div id="senha-maiuscula">❌ Uma letra maiúscula</div>
            <div id="senha-numero">❌ Um número</div>
            <div id="senha-especial">❌ Um caractere especial</div>
          </div>

          <button class="mf-btn mf-btn-primary" type="submit">
            Alterar senha
          </button>
        </form>

        <div class="mf-recovery-info">
          <span>●</span>
          O link de recuperação é válido por 10 minutos e pode ser utilizado
          apenas uma vez.
        </div>
      </section>
    </div>

    <script src="../script/api.js"></script>
    <script src="../script/recuperacao.js"></script>
  </body>
</html>
