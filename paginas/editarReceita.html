<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar receita · MacroFlow</title>
    <link rel="stylesheet" href="../style/macroflow.css" />
    <link rel="icon" href="../img/icone.png" />
  </head>
  <body>
    <div class="mf-shell">
      <div class="mf-frame">
        <nav class="mf-topbar">
          <a class="mf-brand" href="home.html"
            ><span class="mf-brand-mark"
              ><svg viewBox="0 0 24 24">
                <path d="M20 4C12 4 5 8 5 15c0 2.8 2.2 5 5 5 7 0 10-7 10-16Z" />
                <path d="M5 19c2-4 5-7 10-9" /></svg></span
            ><span class="mf-brand-name">MacroFlow</span></a
          >
          <div class="mf-top-actions">
            <a href="perfil.html">Perfil</a><a href="home.html">Núcleo</a>
          </div>
        </nav>
        <nav class="mf-bottom-nav">
          <a class="" href="home.html"
            ><svg viewBox="0 0 24 24">
              <path d="M20 4C12 4 5 8 5 15c0 2.8 2.2 5 5 5 7 0 10-7 10-16Z" />
              <path d="M5 19c2-4 5-7 10-9" /></svg
            ><span>Início</span></a
          ><a class="active" href="comidas.html"
            ><svg viewBox="0 0 24 24">
              <path d="M6 4v7a3 3 0 0 0 3 3V4" />
              <path d="M12 4v16" />
              <path d="M16 4v16" />
              <path d="M20 4v16" /></svg
            ><span>Alimentação</span></a
          ><a class="" href="meuCorpo.html"
            ><svg viewBox="0 0 24 24">
              <circle cx="12" cy="4.5" r="2.3" />
              <path d="M7.5 20c.6-5.2 1.4-8.9 4.5-8.9s3.9 3.7 4.5 8.9" />
              <path d="M9 8.5c.8 1.2 1.8 1.8 3 1.8s2.2-.6 3-1.8" /></svg
            ><span>Meu Corpo</span></a
          ><a class="" href="chatbot.html"
            ><svg viewBox="0 0 24 24">
              <path
                d="M8 17H6a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3h12a3 3 0 0 1 3 3v6a3 3 0 0 1-3 3h-4l-4 3v-3Z"
              />
              <path d="M8 10h.01M12 10h.01M16 10h.01" /></svg
            ><span>IA</span></a
          >
        </nav>
        <main>
          <header class="mf-page-head">
            <div>
              <div class="mf-kicker">ALIMENTAÇÃO / RECEITAS</div>
              <h1 class="mf-title">Editar receita</h1>
              <p class="mf-subtitle">
                O nome identifica a receita. Logo abaixo ficam os itens que
                compõem sua preparação.
              </p>
            </div>
          </header>
          <section class="mf-card mf-card-pad">
            <form class="mf-form" onsubmit="editarReceita(event)">
              <div class="mf-field">
                <label for="nome">Nome da receita</label
                ><input type="text" id="nome" required />
              </div>
              <div class="mf-form-actions">
                <a class="mf-btn mf-btn-ghost" href="receitas.html">Cancelar</a
                ><button class="mf-btn mf-btn-primary" type="submit">
                  Salvar alterações
                </button>
              </div>
            </form>
          </section>
          <section class="mf-card mf-card-pad" style="margin-top: 16px">
            <div class="mf-row">
              <div>
                <div class="mf-kicker">Composição</div>
                <div class="mf-card-title">Itens da receita</div>
              </div>
              <span class="mf-note"
                >Cada item pode ser editado ou removido.</span
              >
            </div>
            <div class="mf-table-wrap" style="margin-top: 14px">
              <table id="tabelaItens"></table>
            </div>
          </section>
          <section class="mf-card mf-card-pad" style="margin-top: 16px">
            <div class="mf-kicker">Adicionar item</div>
            <div class="mf-card-title">Compor receita</div>
            <form
              class="mf-form"
              style="margin-top: 16px"
              onsubmit="adicionarItem(event)"
            >
              <div class="mf-field">
                <label for="comida">Alimento</label
                ><select id="comida"></select>
              </div>
              <div class="mf-form-grid">
                <div class="mf-field">
                  <label for="quantidade">Quantidade</label
                  ><input type="number" step="0.01" id="quantidade" required />
                </div>
                <div class="mf-field">
                  <label for="unidade">Unidade</label
                  ><input type="text" id="unidade" />
                </div>
              </div>
              <div class="mf-field">
                <label for="valor">Valor</label
                ><input type="number" step="0.01" id="valor" required />
              </div>
              <div class="mf-form-actions">
                <button class="mf-btn mf-btn-primary" type="submit">
                  Adicionar item
                </button>
              </div>
            </form>
          </section>
        </main>
      </div>
    </div>
    <script src="../script/api.js"></script>
    <script src="../script/receitaItem.js"></script>
    <script src="../script/receita.js"></script>
  </body>
</html>
