<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmar acesso · MacroFlow</title>
    <link rel="stylesheet" href="../style/macroflow.css" />
    <link rel="icon" href="../img/icone.png" />
  </head>
  <body>
    <div class="mf-auth-shell">
      <section class="mf-auth" style="max-width: 680px; display: block">
        <section class="mf-auth-panel">
          <div class="mf-brand" style="margin-bottom: 34px">
            <span class="mf-brand-mark">
              <img src="../img/icone.png" alt="MacroFlow" />
            </span>
          </div>
          <div class="mf-kicker">Confirmação</div>
          <h1 class="mf-title" style="font-size: 39px">Confirme seu acesso.</h1>
          <p class="mf-subtitle">
            Um código foi enviado para o e-mail usado no login. Digite-o abaixo
            para continuar.
          </p>
          <form
            class="mf-form"
            style="margin-top: 24px"
            onsubmit="validarLogin(event)"
          >
            <div class="mf-field">
              <label for="codigo">Código</label
              ><input
                id="codigo"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
              />
            </div>
            <button class="mf-btn mf-btn-primary" type="submit">
              Confirmar código
            </button>
          </form>
          <div class="card-footer" style="margin-top: 18px">
            <a href="login.html">Voltar ao login</a>
          </div>
        </section>
      </section>
    </div>
    <script src="../script/api.js"></script>
    <script src="../script/auth.js"></script>
  </body>
</html>
